name: Daily Phison Market and Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 16:40 台灣時間：收盤價、三大法人；22:00：補上晚間公布的融資融券與借券
    - cron: '40 8 * * 1-5'
    - cron: '0 14 * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: phison-pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update market data
        run: python update.py
      - name: Save daily snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          git diff --cached --quiet || (git commit -m "Daily trading update" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
